<div class="field-group">
  <span class="field-label">{{ 'raidBuilder.seriesDialog.zones' | transloco }}</span>
  @if (zones().length === 0) {
    <p class="mode-hint">{{ 'raidBuilder.seriesDialog.noZones' | transloco }}</p>
  } @else {
    <app-raid-zone-picker [zones]="zones()" [(selectedZoneIds)]="selectedZoneIds" [disabled]="disabled()" />
  }
</div>
