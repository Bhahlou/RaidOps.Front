<div class="event-tabs">
  @for (event of sortedEvents(); track event.id) {
    <button
      type="button"
      class="event-tab"
      [class.active]="event.id === activeEventId()"
      [class.event-tab--cancelled]="event.status === RaidStatus.Cancelled"
      (click)="select.emit(event.id)"
    >
      {{ tabLabel(event) }}
      @if (event.publicationStatus === PublicationStatus.Draft) {
        <span class="event-tab-draft-badge">{{ 'raidBuilder.draft' | transloco }}</span>
      }
    </button>
  }

  @if (sortedEvents().length === 0) {
    <span class="event-tabs-empty">{{ 'raidBuilder.tabs.empty' | transloco }}</span>
  }

  @if (!disabled()) {
    <button type="button" class="event-tab event-tab--add" [attr.aria-label]="'raidBuilder.tabs.addEvent' | transloco" (click)="createEvent.emit()">
      <span class="material-icons">add</span>
    </button>
  }
</div>
