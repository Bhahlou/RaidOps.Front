<app-form-field-card class="full-width" [label]="'guildSettings.branches.activation.label' | transloco">
  <p class="field-hint">{{ 'guildSettings.branches.activation.hint' | transloco }}</p>
  <app-multi-select
    [inputId]="'guild-branches-activation-input'"
    [options]="branchOptions()"
    [placeholder]="branchesPlaceholder()"
    [disabled]="isLoading()"
    [value]="activeBranchIds()"
    (valueChange)="onBranchSelectionChange($event)"
  />
</app-form-field-card>

@if (activeBranches().length > 0) {
  <div class="branch-settings-list">
    @for (branch of activeBranches(); track branch.id) {
      <app-guild-branch-settings-card
        [guildId]="guildId()"
        [branch]="branch"
        [roles]="availableRoles()"
        [rolesLoading]="rolesLoading()"
      />
    }
  </div>
}
