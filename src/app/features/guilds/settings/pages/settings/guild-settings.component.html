<div class="guild-page">
  <app-page-header [items]="breadcrumbs()" [manualLink]="{ category: 'guild', article: 'settings' }" />
  <div class="settings-content">
    <app-tabs [tabs]="tabs" [activeTabId]="activeTab()" (tabChange)="onTabChange($event)" />

    <div id="panel-general" role="tabpanel" aria-labelledby="tab-general" [hidden]="activeTab() !== 'general'">
      <app-guild-settings-form [guildId]="guildId" [autoSave]="true" />
      <app-guild-branches [guildId]="guildId" />
    </div>

    <div id="panel-roster" role="tabpanel" aria-labelledby="tab-roster" [hidden]="activeTab() !== 'roster'">
      <app-guild-roster-branches [guildId]="guildId" />
    </div>

    <div id="panel-raids" role="tabpanel" aria-labelledby="tab-raids" [hidden]="activeTab() !== 'raids'">
      @if (selectedBranch(); as branch) {
        @if (activeBranches().length > 1) {
          <app-select
            class="branch-select"
            inputId="raids-branch"
            [label]="'guildSettings.branchPicker.label' | transloco"
            [options]="branchOptions()"
            [value]="'' + branch.id"
            (valueChange)="onBranchChange($event)"
          />
        }
        <app-guild-branch-raid-settings-card [guildId]="guildId" [branch]="branch" />
        @if (selectedBranchExpansionId(); as expansionId) {
          <app-guild-attribution-settings [guildId]="guildId" [guildBranchId]="branch.id" [expansionId]="expansionId" />
        }
      } @else {
        <p class="empty-hint">{{ 'guildSettings.branches.noActiveBranches' | transloco }}</p>
      }
    </div>

    <div
      id="panel-notifications"
      role="tabpanel"
      aria-labelledby="tab-notifications"
      [hidden]="activeTab() !== 'notifications'"
    >
      <app-guild-notification-settings [guildId]="guildId" />
    </div>
  </div>
</div>
