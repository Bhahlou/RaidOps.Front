<h2 class="dialog-title">{{ 'raidBuilder.eventDialog.createTitle' | transloco }}</h2>

<div class="dialog-content">
  <div class="field-group">
    <label class="field-label" for="event-name">{{ 'raidBuilder.eventDialog.name' | transloco }}</label>
    <input
      id="event-name"
      type="text"
      class="text-input"
      autocomplete="off"
      [value]="name()"
      (input)="name.set($any($event.target).value)"
      maxlength="128"
    />
  </div>

  <div class="field-group">
    <label class="field-label" for="event-starts-at">{{ 'raidBuilder.eventDialog.startsAt' | transloco }}</label>
    <input
      id="event-starts-at"
      type="datetime-local"
      class="datetime-input"
      [value]="startsAtLocal()"
      (change)="startsAtLocal.set($any($event.target).value)"
    />
  </div>

  <div class="field-row">
    <div class="field-group">
      <label class="field-label" for="event-groups">{{ 'raidBuilder.seriesDialog.groupCount' | transloco }}</label>
      <input
        id="event-groups"
        type="number"
        min="1"
        max="8"
        class="number-input"
        [value]="groupCount()"
        (change)="groupCount.set(+$any($event.target).value)"
      />
    </div>
    <div class="field-group">
      <label class="field-label" for="event-slots">{{ 'raidBuilder.seriesDialog.slotsPerGroup' | transloco }}</label>
      <input
        id="event-slots"
        type="number"
        min="1"
        max="10"
        class="number-input"
        [value]="slotsPerGroup()"
        (change)="slotsPerGroup.set(+$any($event.target).value)"
      />
    </div>
  </div>

  <app-raid-zone-field [zones]="zones()" [(selectedZoneIds)]="selectedZoneIds" />

  <div class="field-group">
    <label class="field-label" for="event-extends">{{ 'raidBuilder.eventDialog.extendsRaidEvent' | transloco }}</label>
    <app-select
      inputId="event-extends"
      [options]="extendCandidates()"
      [placeholder]="'raidBuilder.eventDialog.extendsRaidEventPlaceholder' | transloco"
      [(value)]="extendsRaidEventId"
    />
  </div>

  @if (showSignupOverride()) {
    <div class="field-group">
      <app-checkbox [checked]="signupOverride()" (checkedChange)="signupOverride.set($event)">
        {{ 'raidBuilder.eventDialog.signupOverride' | transloco }}
      </app-checkbox>
    </div>
  }

  @if (isSignupMode()) {
    <app-raid-channel-field
      [channels]="channels()"
      [categories]="categories()"
      [canCreateRootChannel]="canCreateRootChannel()"
      [raidName]="name()"
      [startsAtLocal]="startsAtLocal()"
      [guildLanguage]="guildLanguage()"
      [(channelMode)]="channelMode"
      [(selectedChannelId)]="selectedChannelId"
      [(selectedCategoryId)]="selectedCategoryId"
      [(newChannelName)]="newChannelName"
      (canCreateAtSelectionChange)="canCreateChannelAtSelection.set($event)"
    />
  }
</div>

<div class="dialog-actions">
  <app-button variant="text" (click)="cancel()">{{ 'raidBuilder.actions.cancel' | transloco }}</app-button>
  <app-button variant="primary" [disabled]="!canSubmit()" (click)="submit()">
    {{ 'raidBuilder.actions.save' | transloco }}
  </app-button>
</div>
