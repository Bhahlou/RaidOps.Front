<div class="tabs" role="tablist">
  @for (tab of tabs(); track tab.id) {
    <button
      type="button"
      role="tab"
      class="tab"
      [id]="'tab-' + tab.id"
      [attr.aria-selected]="tab.id === activeTabId()"
      [attr.aria-controls]="'panel-' + tab.id"
      [class.tab--active]="tab.id === activeTabId()"
      (click)="select(tab.id)"
    >
      {{ tab.labelKey | transloco }}
    </button>
  }
</div>
