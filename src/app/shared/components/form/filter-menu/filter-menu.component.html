<button
  type="button"
  class="icon-btn filter-btn"
  [class.filter-btn--chip]="label()"
  [class.filter-active]="hasSelection()"
  [cdkMenuTriggerFor]="panel"
  (cdkMenuOpened)="onOpened()"
  [title]="triggerTitle()"
>
  <span class="material-icons">filter_list</span>
  @if (label()) {
    <span class="filter-btn-label">{{ selectedSummary() ?? label() }}</span>
  }
</button>

<ng-template #panel>
  <div class="filter-panel" cdkMenu>
    <!-- stopPropagation keeps typing in the search box from triggering CdkMenu's typeahead -->
    <div class="filter-search" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()">
      <span class="material-icons filter-search-icon">search</span>
      <input
        #searchInput
        type="text"
        [attr.aria-label]="searchAriaLabel()"
        [placeholder]="searchPlaceholder()"
        [value]="query()"
        (input)="query.set(searchInput.value)"
      />
    </div>
    <ul class="filter-options">
      <li>
        <button
          type="button"
          class="filter-option"
          cdkMenuItem
          [class.filter-option--selected]="multiple() ? !hasSelection() : selected() === undefined"
          (click)="multiple() ? clearMany() : select(undefined)"
        >
          {{ allLabel() }}
        </button>
      </li>
      @for (opt of filteredOptions(); track opt.value) {
        <li>
          @if (multiple()) {
            <button
              type="button"
              class="filter-option"
              role="menuitemcheckbox"
              [attr.aria-checked]="isChecked(opt.value)"
              [class.filter-option--selected]="isChecked(opt.value)"
              (click)="toggle(opt.value)"
            >
              @if (opt.iconUrl) {
                <img class="filter-option-icon" [src]="opt.iconUrl" alt="" width="16" height="16" />
              }
              {{ opt.label }}
            </button>
          } @else {
            <button
              type="button"
              class="filter-option"
              cdkMenuItem
              [class.filter-option--selected]="selected() === opt.value"
              (click)="select(opt.value)"
            >
              @if (opt.iconUrl) {
                <img class="filter-option-icon" [src]="opt.iconUrl" alt="" width="16" height="16" />
              }
              {{ opt.label }}
            </button>
          }
        </li>
      }
    </ul>
  </div>
</ng-template>
